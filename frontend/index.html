<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Produtos</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-box"></i> Sistema de Gerenciamento de Produtos</h1>
    </header>

    <main>
      <div class="products-section">
        <h2><i class="fas fa-list"></i> Lista de Produtos</h2>
        <div id="products" class="products-grid"></div>
      </div>

      <div class="forms-container">
        <form id="add-product-form" class="card">
          <h2><i class="fas fa-plus-circle"></i> Adicionar Produto</h2>
          <div class="form-group">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required placeholder="Digite o nome do produto">
          </div>
          <div class="form-group">
            <label for="description">Descrição:</label>
            <input type="text" id="description" name="description" required placeholder="Digite a descrição">
          </div>
          <div class="form-group">
            <label for="price">Preço:</label>
            <input type="number" id="price" name="price" required step="0.01" placeholder="0.00">
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Adicionar
          </button>
        </form>

        <div id="search-section" class="card">
          <h2><i class="fas fa-search"></i> Buscar Produto por ID</h2>
          <div class="form-group">
            <label for="search-id">ID do Produto:</label>
            <input type="number" id="search-id" placeholder="Digite o ID do produto">
          </div>
          <button onclick="searchProduct()" class="btn btn-primary">
            <i class="fas fa-search"></i> Buscar
          </button>
          <div id="search-result"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    window.addEventListener('load', fetchProducts);
  </script>
</body>
</html>
